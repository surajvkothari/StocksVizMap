<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks Viz Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1 class="title">Stocks Viz Map</h1>

    <div class="container p-0">
        <!-- Control Panel to be implemented later -->
        <div id="control-panel" class="row g-0 justify-content-around">
            <!-- Index fund filters (toggles) -->
            <button class="col-1" disabled>S&P500</button>
            <button class="col-1" disabled>Nasdaq100</button>
            <button class="col-1" disabled>FTSE100</button>

            <!-- Map navigation buttons -->
            <button class="col-1 ms-auto" disabled>Zoom In</button>
            <button class="col-1" disabled>Zoom Out</button>
            <button class="col-1" disabled>Reset Zoom</button>
            <button class="col-1" disabled>Full Screen</button>            
        </div>
        <!-- Hard-coded canvas dimensions -->
        <canvas id="map" width="1440" height="600"></canvas>
    </div>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
